<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#2e2854" />
      <stop offset="0.6" stop-color="#1e2140" />
      <stop offset="1" stop-color="#161a22" />
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#62d9b5" stop-opacity="0.4" />
      <stop offset="0.55" stop-color="#62d9b5" stop-opacity="0.12" />
      <stop offset="1" stop-color="#62d9b5" stop-opacity="0" />
    </radialGradient>
    <!-- Cuts the lines out under the tip nodes so those rings stay hollow over the gradient. -->
    <mask id="holes">
      <rect width="64" height="64" fill="#fff" />
      <circle cx="32" cy="10" r="2.2" />
      <circle cx="20" cy="22" r="2.2" />
      <circle cx="44" cy="15" r="2.2" />
    </mask>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <!-- Ground shadow: scenery only, kept apart from the graph so the graph stays one git could draw. -->
  <ellipse cx="32" cy="54" rx="13" ry="2" fill="#6ea1ff" fill-opacity="0.18" />
  <!-- Saguaro cactus drawn the way the history view draws its graph: straight vertical lanes, lane switches as
       S-curves with vertical ends, and each branch in the next lane colour (the color-graph-1, 2 and 3 tokens).
       The trunk grows from the root commit; filled nodes are commits, hollow nodes the branch tips. -->
  <g transform="translate(32 11) scale(0.884) translate(-32 -10)">
    <circle cx="44" cy="15" r="7.5" fill="url(#glow)" />
    <g mask="url(#holes)" fill="none" stroke-width="2.7" stroke-linecap="round">
      <path d="M32 45 C32 38.5 20 38.5 20 32 L20 22" stroke="#c3b1ff" />
      <path d="M32 35 C32 28.5 44 28.5 44 22 L44 15" stroke="#62d9b5" />
      <path d="M32 53 L32 10" stroke="#6ea1ff" />
    </g>
    <g fill="none" stroke-width="1.35">
      <circle cx="32" cy="10" r="2.2" stroke="#6ea1ff" />
      <circle cx="20" cy="22" r="2.2" stroke="#c3b1ff" />
      <circle cx="44" cy="15" r="2.2" stroke="#62d9b5" />
      <!-- Soft ripples marking HEAD, echoing the history view's pulse: the green branch is the one checked out. -->
      <circle cx="44" cy="15" r="4.6" stroke="#62d9b5" stroke-opacity="0.45" stroke-width="0.9" />
      <circle cx="44" cy="15" r="6.8" stroke="#62d9b5" stroke-opacity="0.18" stroke-width="0.8" />
    </g>
    <g fill="#6ea1ff">
      <circle cx="32" cy="45" r="2.5" />
      <circle cx="32" cy="35" r="2.5" />
      <circle cx="32" cy="53" r="2.5" />
    </g>
  </g>
</svg>
